name: neon-cleanup

# Deletes the Neon branch that the Vercel–Neon integration created for a
# pull request's preview deployment (preview/<head branch>) once the PR closes.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-preview-branch:
    # Forks have no NEON_API_KEY.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      BRANCH_NAME: preview/${{ github.head_ref }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Does the preview branch exist?
        id: lookup
        # Auth or project errors fail here (visibly); only a genuinely absent
        # branch skips the delete step.
        run: |
          set -euo pipefail
          npx --yes neonctl@2 branches list --project-id "$NEON_PROJECT_ID" --api-key "$NEON_API_KEY" --output json > branches.json
          if node -e 'const b=require("./branches.json"); process.exit(b.some(x=>x.name===process.env.BRANCH_NAME)?0:1)'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Neon branch named $BRANCH_NAME; nothing to delete."
          fi
      - if: steps.lookup.outputs.exists == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
