name: neon-cleanup

# Deletes the Neon branch that the Vercel–Neon integration created for a
# pull request's preview deployment (preview/<head branch>) once the PR closes.
# Uses the Neon REST API directly: neonctl cannot resolve this Vercel-managed
# project with an organization API key ("project not found"), the API can.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-preview-branch:
    # Forks have no NEON_API_KEY.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      BRANCH_NAME: preview/${{ github.head_ref }}
    steps:
      - name: Delete the preview branch if it exists
        # Auth or project errors fail here (visibly); only a genuinely absent
        # branch is a no-op.
        run: |
          set -euo pipefail
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          list=$(curl -sS --fail -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" "$api")
          id=$(printf '%s' "$list" | jq -r --arg n "$BRANCH_NAME" '.branches[] | select(.name == $n) | .id')
          if [ -z "$id" ]; then
            echo "No Neon branch named $BRANCH_NAME; nothing to delete."
            exit 0
          fi
          curl -sS --fail -X DELETE -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" "$api/$id" > /dev/null
          echo "Deleted Neon branch $BRANCH_NAME ($id)."
