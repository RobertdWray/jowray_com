name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # A throwaway Postgres for `__tests__/integration/*` (issue #44, D7): the budget race is an
    # isolation property the in-memory mocks cannot show. The app's DATABASE_URL stays unset.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jowray_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/jowray_test
      - run: npm run test:run
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jowray_test
      - run: npm run build
