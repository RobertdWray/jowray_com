<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Jo Wray — Thank you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..800,50..100&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
body{margin:0;background-color:#F6EFE3;background-image:linear-gradient(rgba(91,125,177,.08) 50%,transparent 50%),linear-gradient(90deg,rgba(91,125,177,.08) 50%,transparent 50%);background-size:36px 36px;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#2E2420}
a{color:#A50D26}a:hover{color:#2E2420}
.patch{background-color:#C8102E;background-image:linear-gradient(45deg,#5B7DB1 25%,transparent 25%,transparent 75%,#5B7DB1 75%),linear-gradient(45deg,#E8A317 25%,transparent 25%,transparent 75%,#E8A317 75%);background-size:32px 32px;background-position:0 0,16px 16px}
</style>
</head>
<body>

<div style="width: 100%; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px; padding: 20px 5%; max-width: 1200px; width: 100%; box-sizing: border-box; margin: 0 auto">
    <a href="./home.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #2E2420">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex: none"><path d="M12 21s-7.2-4.6-9.6-9.1A5.4 5.4 0 0 1 12 6.2a5.4 5.4 0 0 1 9.6 5.7C19.2 16.4 12 21 12 21z" fill="#C8102E"/><path d="M12 19.2s-5.8-3.9-7.9-7.7A4 4 0 0 1 12 7.6a4 4 0 0 1 7.9 3.9C17.8 15.3 12 19.2 12 19.2z" stroke="#F6EFE3" stroke-width="1.1" stroke-dasharray="1.6 1.4" stroke-linecap="round"/></svg>
      <span style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 30px; letter-spacing: -0.01em">Jo Wray</span>
    </a>
    <a href="./home.html" style="font-size: 19px; font-weight: 700; text-decoration: none; padding: 10px 0">Back to the start</a>
  </header>

  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 40px 5% 80px">
    <div style="max-width: 760px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center">
      <div class="patch" style="padding: 14px; border-radius: 50%; box-shadow: 0 12px 26px rgba(46,36,32,.18)">
        <div style="width: 150px; height: 150px; border-radius: 50%; background: #FFFDF8; display: flex; align-items: center; justify-content: center">
          <svg width="96" height="96" viewBox="0 0 24 24" fill="none" role="img" aria-label="A stitched red heart"><path d="M12 21s-7.2-4.6-9.6-9.1A5.4 5.4 0 0 1 12 6.2a5.4 5.4 0 0 1 9.6 5.7C19.2 16.4 12 21 12 21z" fill="#C8102E"/><path d="M12 19.2s-5.8-3.9-7.9-7.7A4 4 0 0 1 12 7.6a4 4 0 0 1 7.9 3.9C17.8 15.3 12 19.2 12 19.2z" stroke="#FFFDF8" stroke-width="1" stroke-dasharray="1.6 1.4" stroke-linecap="round"/></svg>
        </div>
      </div>
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 60px; line-height: 1.05; letter-spacing: -0.02em">Jo would have loved this.</h1>
      <p style="margin: 0; font-size: 22px; line-height: 1.5; max-width: 30em">Thank you. Your memory is on its way to Richard, Rob and Tracy. We read every single one, usually more than once.</p>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 16px">
        <a href="./home.html#form" style="display: inline-flex; align-items: center; justify-content: center; min-height: 64px; padding: 14px 30px; box-sizing: border-box; background: #C8102E; color: #FFFFFF; font-size: 22px; font-weight: 700; text-decoration: none; border-radius: 14px; box-shadow: 0 5px 0 #7D0A1E">Tell another one</a>
        <a href="./home.html#ways" style="display: inline-flex; align-items: center; justify-content: center; min-height: 64px; padding: 14px 24px; box-sizing: border-box; color: #2E2420; font-size: 20px; font-weight: 700; text-decoration: none; border: 3px dashed #8A7259; border-radius: 14px">Send this page to someone who knew Jo</a>
      </div>
      <p style="margin: 8px 0 0; font-family: 'Fraunces', Georgia, serif; font-size: 20px; color: #5A4A3E; font-style: italic">Spelling, as promised, did not count.</p>
    </div>
  </main>

</div>
</body>
</html>
